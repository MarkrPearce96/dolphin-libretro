name: libretro_release

# Builds the dolphin-libretro core as a macOS UNIVERSAL (arm64 + x86_64)
# dylib on a v* tag push and publishes a GitHub Release with
# dolphin_libretro.dylib.zip — the asset RetroNest installs. Keeping the
# historical single-asset name means every existing install keeps working
# and both RetroNest app slices (native arm64 + Rosetta) load the same
# core. Each arch is built + dep-bundled separately (Homebrew libs are
# thin), then dylib and bundled libs are lipo'd pairwise and re-signed —
# the same shape as the local deploy.sh flow.

on:
  push:
    tags: ['v*']
  # Manual dry-run: builds + packages, but the release job is tag-gated
  # so nothing is published.
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to create releases

jobs:
  build:
    name: Build macOS universal (arm64 + x86_64)
    # macos-14 = Apple Silicon; the x86_64 half builds via Rosetta + x86_64
    # Homebrew at /usr/local, the arm64 half natively via /opt/homebrew.
    # Chosen over macos-13 because the Intel runner pool is starved.
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Select newest Xcode (Dolphin needs Clang 16+ for C++20 aggregate-init)
        run: |
          # The runner's default Xcode (15.4 = Apple Clang 15) is too old for
          # upstream Dolphin's HookableEvent (parenthesized aggregate init through
          # make_unique, a C++20 feature). Pick the newest Xcode installed and
          # fail fast if it's still < 16 rather than dying mid-build.
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting ${LATEST:-/Applications/Xcode.app}"
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}/Contents/Developer"
          /usr/bin/c++ --version
          ver=$(/usr/bin/c++ --version | sed -n 's/.*Apple clang version \([0-9][0-9]*\).*/\1/p' | head -1)
          if [ "${ver:-0}" -lt 16 ]; then
            echo "::error::Need Apple Clang >= 16 (Xcode 16+); newest on this runner is $ver. Bump runs-on to macos-15."
            exit 1
          fi

      - name: Install x86_64 Homebrew at /usr/local
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew --version

      - name: Install dependencies (x86_64)
        run: |
          arch -x86_64 /usr/local/bin/brew update
          # Runtime deps confirmed from the local x86_64 dylib's otool -L links
          # (sdl3 lz4 lzo xz zstd) + build tools + libpng. Tune over 1-2 CI
          # runs if configure/link reports a missing dep.
          # fmt is deliberately NOT brewed: brew fmt 12.1→12.2 broke Dolphin's
          # PanicYesNoFmt consteval checks (v2026.07.03 run) — we build the
          # vendored Externals/fmt instead (USE_SYSTEM_FMT=OFF below), which
          # also drops the libfmt.dylib runtime dependency from the release.
          arch -x86_64 /usr/local/bin/brew install \
            cmake ninja pkg-config sdl3 lz4 lzo xz zstd libpng dylibbundler

      - name: Configure (x86_64, scrubbing /opt/homebrew)
        run: |
          # Scrub /opt/homebrew (arm64 brew) so CMake doesn't link arm64 libs.
          arch -x86_64 env \
            HOMEBREW_PREFIX=/usr/local \
            HOMEBREW_CELLAR=/usr/local/Cellar \
            HOMEBREW_REPOSITORY=/usr/local/Homebrew \
            PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig \
            PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            /usr/local/bin/cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_IGNORE_PATH=/opt/homebrew \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DENABLE_LIBRETRO=ON \
              -DENABLE_QT=OFF \
              -DENABLE_NOGUI=OFF \
              -DENABLE_TESTS=OFF \
              -DENCODE_FRAMEDUMPS=OFF \
              -DUSE_SYSTEM_FMT=OFF \
              -DCMAKE_BUILD_TYPE=Release

      - name: Build dolphin_libretro (x86_64)
        run: |
          arch -x86_64 env PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            /usr/local/bin/cmake --build build --target dolphin_libretro -j

      - name: Install dependencies (arm64)
        run: |
          # Native /opt/homebrew half of the same dep set.
          brew install \
            cmake ninja pkg-config sdl3 lz4 lzo xz zstd libpng dylibbundler

      - name: Configure (arm64, scrubbing /usr/local)
        run: |
          # Mirror-image prefix hygiene of the x86_64 configure. Both IGNORE
          # flags: config-mode find_package searches prefix roots, plain
          # IGNORE_PATH alone lets x86_64 libs leak in (pcsx2 arm64 lane
          # lesson, 2026-07-18).
          /opt/homebrew/bin/cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_PREFIX_PATH=/opt/homebrew \
            -DCMAKE_IGNORE_PATH=/usr/local \
            -DCMAKE_IGNORE_PREFIX_PATH=/usr/local \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_QT=OFF \
            -DENABLE_NOGUI=OFF \
            -DENABLE_TESTS=OFF \
            -DENCODE_FRAMEDUMPS=OFF \
            -DUSE_SYSTEM_FMT=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build dolphin_libretro (arm64)
        run: |
          /opt/homebrew/bin/cmake --build build-arm64 --target dolphin_libretro -j

      - name: Package universal dolphin_libretro.dylib.zip
        run: |
          set -euo pipefail
          X86_DYLIB=build/Source/Core/DolphinLibretro/dolphin_libretro.dylib
          ARM_DYLIB=build-arm64/Source/Core/DolphinLibretro/dolphin_libretro.dylib
          test -f "$X86_DYLIB" && file "$X86_DYLIB"   # expect x86_64
          test -f "$ARM_DYLIB" && file "$ARM_DYLIB"   # expect arm64
          # Bundle non-system deps (SDL3/lzo/lz4/xz/zstd) beside each dylib so
          # the release doesn't depend on the user's Homebrew versions — a
          # versioned-dylib mismatch = silent dlopen failure (this broke
          # in-app-updated pcsx2 on 2026-07-04). Bundle + flatten + sign +
          # verify live in the vendored contract package (deploy-contract.md
          # §Dependency bundling), drift-checked like every package file.
          # Homebrew libs are thin, so each arch bundles separately and the
          # results are lipo'd pairwise below.
          mkdir -p stage-x86_64 stage-arm64 stage/dolphin_libretro_libs
          cp "$X86_DYLIB" stage-x86_64/ && cp "$ARM_DYLIB" stage-arm64/
          Source/Core/DolphinLibretro/retronest-libretro/package-core.sh \
            stage-x86_64/dolphin_libretro.dylib --arch x86_64
          Source/Core/DolphinLibretro/retronest-libretro/package-core.sh \
            stage-arm64/dolphin_libretro.dylib --arch arm64
          # Lipo the core; then the bundled libs pairwise. The two libs dirs
          # must contain the SAME set of names — a difference means the arch
          # builds resolved different deps and the universal core would fail
          # on whichever slice is missing one, so fail the build loudly.
          lipo -create stage-x86_64/dolphin_libretro.dylib \
                       stage-arm64/dolphin_libretro.dylib \
               -output stage/dolphin_libretro.dylib
          diff <(ls stage-x86_64/dolphin_libretro_libs | sort) \
               <(ls stage-arm64/dolphin_libretro_libs | sort)
          for lib in stage-arm64/dolphin_libretro_libs/*.dylib; do
            name=$(basename "$lib")
            lipo -create "stage-x86_64/dolphin_libretro_libs/$name" "$lib" \
                 -output "stage/dolphin_libretro_libs/$name"
            codesign --force --sign - "stage/dolphin_libretro_libs/$name"
          done
          codesign --force --sign - stage/dolphin_libretro.dylib
          # Verify: both slices present, no bare Homebrew refs in either.
          lipo -info stage/dolphin_libretro.dylib | tee /dev/stderr \
            | grep -q "x86_64 arm64\|arm64 x86_64"
          if otool -L stage/dolphin_libretro.dylib | tail -n +2 \
               | grep -E '/usr/local|/opt/homebrew'; then
            echo "::error::universal dylib still references Homebrew paths"
            exit 1
          fi
          # SP9: ship Sys data beside the dylib. The core points Sys at
          # dolphin_libretro_resources/Sys via dladdr (LibretroFrontend.cpp),
          # so GitHub-installed cores work without any host-side deploy step.
          mkdir -p stage/dolphin_libretro_resources
          cp -R Data/Sys stage/dolphin_libretro_resources/Sys
          test -f stage/dolphin_libretro_resources/Sys/GC/font_western.bin
          (cd stage && zip -qr ../dolphin_libretro.dylib.zip dolphin_libretro.dylib dolphin_libretro_resources dolphin_libretro_libs)
          ls -la dolphin_libretro.dylib.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin_libretro-dylib-zip
          path: dolphin_libretro.dylib.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dolphin_libretro-dylib-zip
          path: .
      - name: Compute upstream SHA
        id: meta
        run: |
          git remote add upstream https://github.com/dolphin-emu/dolphin.git
          # --no-tags: don't pull upstream Dolphin's tags into our release repo
          git fetch --no-tags upstream master
          echo "upstream_short=$(git merge-base HEAD upstream/master | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Compose body
        run: |
          {
            echo "**Platform:** macOS universal (Apple Silicon native arm64 + Intel/Rosetta x86_64)"
            echo "**Upstream Dolphin:** ${{ steps.meta.outputs.upstream_short }} (master)"
            echo ""
            echo "Note: Dolphin save states are arch-sensitive — states made on one"
            echo "arch won't load on the other. In-game (battery/memcard) saves are fine."
          } > body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dolphin_libretro.dylib.zip
          body_path: body.md
          generate_release_notes: true
          fail_on_unmatched_files: true  # fail loudly if the dylib zip is missing
